<!DOCTYPE html><html><head><meta charset="utf-8"><title>l5 test</title>
<style>body{margin:0;background:#111}iframe{border:0;width:1100px;height:620px;display:block}</style></head><body>
<iframe id="f"></iframe><div id="dbg" style="position:fixed;left:6px;bottom:2px;color:#9f9;font:12px monospace"></div>
<script>
// usage: l5-test.html?lvl=5&js=<code>. The real rAF loop is stopped; the test steps the game's own loop()
// on a synthetic clock: T = game hook, run(ms) = advance, say(x) = print to the readout.
const q = new URLSearchParams(location.search);
try { localStorage.setItem('goofy-horror-beaten', '1'); localStorage.setItem('goofy-horror-story', JSON.stringify({ completed: [], unlocked: 31 })); localStorage.setItem('goofy-horror-menu-music', 'off'); } catch (e) {}
const f = document.getElementById('f');
f.src = '../level' + (q.get('lvl') || 5) + '.html?t=' + Date.now();
f.onload = () => {
  const w = f.contentWindow;
  w.requestAnimationFrame = () => 0;
  setTimeout(() => w.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' })), 900);
  setTimeout(() => {
    const T = w.__t;
    let clock = w.performance.now();
    const run = (ms) => { for (let e = 0; e < ms; e += 16) { clock += 16; T.loop(clock); } };
    const say = (x) => { document.getElementById('dbg').textContent += ' ' + (typeof x === 'string' ? x : JSON.stringify(x)); };
    run(50);                                   // leaves the intro
    T.players.forEach((p) => { p.invulnerableUntil = 1e12; });
    const code = q.get('js');
    try { new Function('T', 'w', 'run', 'say', 'now', code || '')(T, w, run, say, () => clock); } catch (e) { say('ERR ' + e.message); }
    w.document.getElementById('game-canvas').scrollIntoView();
  }, 1600);
};
</script></body></html>
