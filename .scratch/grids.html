let out=[];
for(let n=1;n<=30;n++){const L=window['LEVEL'+n];if(!L){out.push(n+' none');continue;}
const g=L.grid;const cnt={};let rows=g.length;const rs=g.map(r=>typeof r==='string'?r:r.join?r.join(''):'?');
for(const r of rs)for(const c of r)cnt[c]=(cnt[c]||0)+1;

document.getElementById('o').textContent=out.join(' || ');
</script></body>
