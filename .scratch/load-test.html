<body><pre id="o"></pre>
<script>
try { localStorage.setItem('goofy-horror-beaten', '1'); localStorage.setItem('goofy-horror-story', JSON.stringify({ completed: [], unlocked: 31 })); localStorage.setItem('goofy-horror-menu-music', 'off'); } catch (e) {}
const levels=[1,2,3,4,6,7,8,9,11,12,13,14,16,17,18,19,21,22,23,24,26,27,28,29];
const res={};
levels.forEach((n,i)=>{
  const f=document.createElement('iframe');f.style.cssText='width:920px;height:360px;border:0;position:absolute;left:0;top:0';
  f.src='/level'+n+'.html?t='+Date.now();document.body.appendChild(f);
  res[n]={err:[],frames:0};
  f.onload=()=>{const w=f.contentWindow;
    w.addEventListener('error',e=>res[n].err.push(String(e.message)));
    const ce=w.console.error;w.console.error=(...a)=>{res[n].err.push(a.map(String).join(' ').slice(0,160));};
    const raf=w.requestAnimationFrame.bind(w);w.requestAnimationFrame=(cb)=>raf((t)=>{res[n].frames++;cb(t)});
    setTimeout(()=>w.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'})),500);
  };
});
setTimeout(()=>{document.getElementById('o').textContent=Object.entries(res).map(([n,r])=>n+': frames='+r.frames+' errs='+r.err.length+' '+(r.err[0]||'')).join('\n');},14000);
</script></body>
