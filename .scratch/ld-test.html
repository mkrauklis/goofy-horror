<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="920" height="340"></canvas><div id="dbg" style="position:fixed;left:4px;bottom:2px;color:#9f9;font:11px monospace"></div>
<script>
const q=new URLSearchParams(location.search); const n=+q.get('lvl')||1;
const s=document.createElement('script'); s.src='/levels/level'+n+'/level.js';
s.onload=()=>{const s2=document.createElement('script');s2.src='/js/leveldetails.js';s2.onload=run;document.body.appendChild(s2)};
document.body.appendChild(s);
function run(){
  const L=window['LEVEL'+n], T=L.tileSize, G=L.grid; const ch=Math.ceil(n/5);
  const LD=LevelDetails.make(L,n);
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  const W=920,H=340;
  let tx=+q.get('x')||L.spawn1.x, ty=+q.get('y')||L.spawn1.y;
  // optional: search for the first "interesting" spot: q.find = char sequence of decor
  const cam={x:tx*T+T/2,y:ty*T+T/2};
  if(q.get('at')){const list=LD.debug[q.get('at')];const k=+q.get('k')||0;const o=list[Math.min(k,list.length-1)];
    if(o){cam.x=(o.cx!==undefined?o.cx:o.hx!==undefined?o.hx:(o.x+(o.w?o.w/2:0.5))*T);cam.y=(o.cy!==undefined?o.cy:o.hy!==undefined?o.hy:(o.y+(o.h?o.h/2:0.5))*T);}
    document.title=q.get('at')+' count='+list.length;}
  const pal={1:['#2a303a','#3a4452'],2:['#2b2824','#3a3631'],3:['#8fa0b0','#a3b4c4'],4:['#2c3a40','#3a4a50'],5:['#2a3a24','#344a2c'],6:['#3c3c42','#4a4a52']}[ch];
  const now=+q.get('t')||5000;
  const players=[{x:cam.x+(+q.get('dx')||0),y:cam.y+(+q.get('dy')||0)}];
  
  LD.update(0.016,players);
  if(q.get('sim')){ for(let i=0;i<+q.get('sim');i++) LD.update(0.016,players); }
  ctx.fillStyle='#050308';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2-cam.x,H/2-cam.y);
  const x0=Math.max(0,Math.floor((cam.x-W/2)/T)-1),x1=Math.min(L.cols-1,Math.floor((cam.x+W/2)/T)+1),y0=Math.max(0,Math.floor((cam.y-H/2)/T)-1),y1=Math.min(L.rows-1,Math.floor((cam.y+H/2)/T)+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const ch2=G[y][x];ctx.fillStyle=ch2==='#'?'#15181c':pal[(x+y)&1];ctx.fillRect(x*T,y*T,T,T);}
  LD.floor(ctx,cam.x,cam.y,W,H,now);
  ctx.fillStyle='#e8c070';ctx.beginPath();ctx.arc(players[0].x,players[0].y,9,0,6.3);ctx.fill();
  LD.above(ctx,cam.x,cam.y,W,H,now);
  ctx.restore();
  if(q.get('dark')){
    const m=document.createElement('canvas');m.width=W;m.height=H;const mc=m.getContext('2d');
    mc.fillStyle='#000';mc.fillRect(0,0,W,H);
    const punch=(g,x,y,r,i)=>{g.save();g.globalCompositeOperation='destination-out';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${i})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.3);g.fill();g.restore();};
    punch(mc,W/2,H/2,90,1);punch(mc,W/2,H/2,230,.85);
    LD.lights(mc,cam.x,cam.y,W,H,now,punch);
    ctx.drawImage(m,0,0);
  }
  document.getElementById('dbg').textContent='lvl '+n+' ch'+ch+' '+document.title;
}
</script></body></html>
