<body><pre id=o></pre>
<script src="/levels/level11/level.js"></script><script src="/js/leveldetails.js"></script>
<script>
const L=LEVEL11,T=L.tileSize,G=L.grid;const LD=LevelDetails.make(L,11);
// find a wide icy+floor row: scan for tile where 8 tiles to right are floor
const isF=(x,y)=>G[y]&&G[y][x]==='.';
let spot=null;
for(let y=2;y<L.rows-2&&!spot;y++)for(let x=2;x<L.cols-14&&!spot;x++){let ok=true;for(let k=0;k<12;k++)if(!isF(x+k,y))ok=false;if(ok){const p={x:x*T+16,y:y*T+16,facing:{x:1,y:0}};
  // probe: does LD.ice engage here? run one step
  const q={x:p.x,y:p.y};LD.ice(q,1,0,0.016,(pp,dx,dy)=>{pp.x+=dx;pp.y+=dy},112.5);if(q._ivx!==undefined&&Math.abs(q._ivx)>0.01)spot=[x,y];}}
const out=[];
function sim(sx,sy,label){const p={x:sx,y:sy,facing:{x:1,y:0}};const mv=(pp,dx,dy)=>{pp.x+=dx;pp.y+=dy};
 let t=0;for(;t<0.5;t+=1/60){if(!LD.ice(p,1,0,1/60,mv,112.5)){mv(p,112.5/60,0)}}
 const xr=p.x-sx;for(let i=0;i<30;i++){if(!LD.ice(p,0,0,1/60,mv,112.5)){}}
 out.push(label+' after 0.5s run: '+xr.toFixed(1)+'px, after 0.5s coast: '+(p.x-sx-xr).toFixed(1)+'px, v='+(p._ivx||0).toFixed(1));}
if(spot){sim(spot[0]*T+16,spot[1]*T+16,'ICE '+spot)}
// non-ice: find a non-icy floor tile
let ns=null;for(let y=2;y<L.rows-2&&!ns;y++)for(let x=2;x<L.cols-3&&!ns;x++){if(!isF(x,y))continue;const q={x:x*T+16,y:y*T+16};LD.ice(q,1,0,0.016,(pp)=>{},112.5);if(LD.ice({x:x*T+16,y:y*T+16,_ivx:112.5,_ivy:0},1,0,0.016,()=>{},112.5)===false)ns=[x,y];}
out.push('spot '+JSON.stringify(spot)+' nonice '+JSON.stringify(ns));
if(ns)sim(ns[0]*T+16,ns[1]*T+16,'NONICE');
document.getElementById('o').textContent=out.join('\n');
</script></body>
