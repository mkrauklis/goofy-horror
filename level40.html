<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desolate Apes &mdash; The Hedge Maze</title>

<body>
<nav class="level-nav">

<header class="hero">
  <h1 id="level-title">The Hedge Maze</h1>
  <p class="objective" id="level-objective"></p>
</header>

<div class="wrap">
  <div id="game-fullscreen-wrap">

      <span id="hud-obj">Keys: 0 / 0</span>
      <span id="hud-door">Door: locked</span>
      <span id="hud-timer">Time: 0:00.0</span>
      <span id="hud-best">Best: --:--</span>
      <button id="music-toggle" class="music-toggle muted" type="button">&#9834; Music: Off</button>
    </div>
    <div id="game-canvas-holder" class="panel">
      <canvas id="game-canvas" width="920" height="340"></canvas>
      <div id="game-message"></div>
    </div>
  </div>
  <p class="hint">Player 1 (orange, left): W A S D &nbsp;&middot;&nbsp; Player 2 (green, right): Arrow keys<span id="sound-hint">&nbsp;&middot;&nbsp;sound plays after your first key press</span></p>
</div>

<div class="wrap">
  <p class="level-description" id="level-desc"></p>
  <p class="level-description"><a href="editor.html#40">Open this level in the designer</a></p>
</div>
